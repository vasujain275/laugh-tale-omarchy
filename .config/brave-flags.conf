# --password-store=gnome

--enable-features=UseOzonePlatform,WaylandUsePortal
--ozone-platform=wayland
--ozone-platform-hint=auto

--enable-features=VaapiVideoDecoder,VaapiVideoEncode
--enable-features=WebRTCHwVP8Encoding,WebRTCHwVP9Encoding

--ignore-gpu-blocklist
--disable-gpu-driver-bug-workarounds
--use-gl=desktop
--enable-accelerated-video-decode
--enable-zero-copy

--disable-features=TranslateUI,OptimizationGuideModelDownloading,WaylandWpColorManagerV1
--disable-notifications
--disable-domain-reliability
# Chromium crash workaround for Wayland color management on Hyprland - see https://github.com/hyprwm/Hyprland/issues/11957
# --disable-features=WaylandWpColorManagerV1
